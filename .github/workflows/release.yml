name: build-and-push
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "api=https://api.auto-garaj.com" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
            echo "api=https://api.staging.auto-garaj.com" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ steps.meta.outputs.api }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/avtoms-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/avtoms-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
